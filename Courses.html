;<!DOCTYPE html>

<head>

    <style>
      /* Course List */
      .course-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .course-card {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        width: calc(90% - 20px);
        box-sizing: border-box;
         display: block;
       text-decoration: none;
        color: inherit;
       transition: 0.2s;
        
      }


      .course-card h2 {
        margin-top: 0;
      }
      .course-card:hover {
    transform: scale(1.02);
    background-color: #f5f5f5;
}


    </style>
</head>
<body>
    <!--Topbar-->

    <div style="display:flex; gap:20px; align-items:center;">

      <div class="profile"></div>
    </div>
  </div>
<!--Sidebar-->
  <div class="sidebar">
    <div class="role"> 
      <h3>Role</h3>
      <p id ="Role">Student</p>
    </div>
    
    
    <button onclick="location.href='index.html'" class="course-btn">Dashboard</button>
    <button onclick="location.href='DummyPage.html'" class="course-btn" style="background-color: #56c7f7; padding-left: 24px;">Course</button>
    <button onclick="location.href='DummyPage.html'" class="course-btn">Assignments</button>
    <button onclick="location.href='DummyPage.html'" class="course-btn">Calendar</button>
    <button onclick="location.href='DummyPage.html'" class="course-btn">Messages</button>
    <button onclick="location.href='DummyPage.html'" class="course-btn">Resources</button>

  </div>

  <script src="Scripts/coursescript.js"></script>
    
</body>
